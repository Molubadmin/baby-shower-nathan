<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby Shower de Nathan</title>
<meta name="description" content="Estás invitado al Baby Shower de Nathan · Sábado 5 de diciembre 2026, 3:00 p.m.">
<meta property="og:title" content="Baby Shower de Nathan 💙">
<meta property="og:description" content="Sábado 5 de diciembre 2026 · 3:00 p.m. Confirma tu asistencia aquí.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://molubadmin.github.io/baby-shower-nathan/">
<meta property="og:image" content="https://molubadmin.github.io/baby-shower-nathan/portada.jpg">
<meta property="og:image:width" content="720">
<meta property="og:image:height" content="1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
  /* Layout: una columna tipo tarjeta, video arriba y acciones abajo. Un solo tema a propósito (azul bebé, como el video). */
  :root {
    --sky: #eaf3fc;
    --card: #ffffff;
    --blue: #3f7fd0;
    --blue-deep: #2a5fa8;
    --ink: #264a78;
    --muted: #6a86ab;
    --line: #cfe0f4;
    --wa: #1f9d55;
    --font-display: "Fredoka", "Nunito", system-ui, sans-serif;
    --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(120% 60% at 50% 0%, #ffffff 0%, var(--sky) 70%) fixed, var(--sky);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    padding-inline: 16px;
    padding-block: 20px 40px;
  }
  .wrap { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .video-box {
    position: relative;
    border-radius: 22px;
    overflow: hidden;
    background: var(--card);
    box-shadow: 0 10px 30px rgba(42, 95, 168, .18);
    aspect-ratio: 2350 / 3526;
    max-width: 100%;
  }
  .video-box video { width: 100%; height: 100%; display: block; object-fit: cover; }
  .sound {
    position: absolute; right: 12px; bottom: 12px;
    border: 0; border-radius: 999px;
    padding: 9px 14px;
    background: rgba(255,255,255,.92);
    color: var(--blue-deep);
    font: 600 14px var(--font-display);
    box-shadow: 0 3px 10px rgba(0,0,0,.15);
    cursor: pointer;
  }

  .play {
    position: absolute; inset: 0; border: 0; background: rgba(255,255,255,.15); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .play span {
    width: 78px; height: 78px; border-radius: 50%; background: rgba(255,255,255,.95); color: var(--blue);
    display: flex; align-items: center; justify-content: center; font-size: 32px; padding-left: 6px;
    box-shadow: 0 6px 20px rgba(0,0,0,.2);
  }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 56px;
    padding: 12px 14px;
    border-radius: 16px;
    font: 600 17px var(--font-display);
    text-decoration: none;
    border: 0;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 3px solid var(--blue-deep); outline-offset: 3px; }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .btn-primary { background: var(--blue); color: #fff; box-shadow: 0 6px 16px rgba(63,127,208,.35); }
  .btn-secondary { background: var(--card); color: var(--blue-deep); border: 2px solid var(--line); }

  .rsvp {
    background: var(--card);
    border-radius: 20px;
    padding: 20px;
    border: 2px solid var(--line);
    display: flex; flex-direction: column; gap: 14px;
  }
  .rsvp h2 { margin: 0; font: 600 22px var(--font-display); color: var(--blue-deep); text-wrap: balance; }
  .rsvp p { margin: 0; color: var(--muted); line-height: 1.45; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-weight: 700; font-size: 14px; }
  .field input {
    font: 600 16px var(--font-body);
    color: var(--ink);
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid var(--line);
    background: #f7fbff;
    width: 100%;
  }
  .field input:focus { outline: none; border-color: var(--blue); }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button {
    width: 46px; height: 46px; border-radius: 12px; border: 2px solid var(--line);
    background: #f7fbff; color: var(--blue-deep); font: 600 22px var(--font-display); cursor: pointer;
  }
  .stepper output { min-width: 3ch; text-align: center; font: 600 22px var(--font-display); font-variant-numeric: tabular-nums; }
  .btn-wa { background: var(--wa); color: #fff; width: 100%; box-shadow: 0 6px 16px rgba(31,157,85,.3); }
  .alt { font-size: 14px; text-align: center; }
  .alt strong { color: var(--ink); user-select: all; }

  .place { text-align: center; color: var(--muted); font-size: 15px; }
  .place strong { color: var(--ink); }

  @media (max-width: 360px) { .actions { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>

<main class="wrap">
  <div class="video-box">
    <video id="vid" poster="portada.jpg" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>
    <button class="play" id="play" type="button" hidden aria-label="Reproducir video"><span>▶</span></button>
    <button class="sound" id="sound" type="button">🔊 Activar sonido</button>
  </div>

  <div class="actions">
    <a class="btn btn-primary" href="#confirmar" id="go-rsvp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      Confirmar asistencia
    </a>
    <a class="btn btn-secondary" href="https://maps.apple/p/55a~E4bUkJVz_M" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      Ver ubicación
    </a>
  </div>

  <p class="place">Sábado <strong>5 de diciembre 2026</strong> · <strong>3:00 p.m.</strong> · <strong>#110</strong></p>

  <form class="rsvp" id="confirmar" novalidate>
    <h2>Confirma tu asistencia</h2>
    <p>Escribe tu nombre y cuántos van. Al tocar el botón se abre WhatsApp con el mensaje listo para enviar.</p>
    <div class="field">
      <label for="nombre">Tu nombre</label>
      <input id="nombre" name="nombre" type="text" autocomplete="name" placeholder="Ej. Familia López">
    </div>
    <div class="field">
      <label for="personas-out">¿Cuántas personas asistirán?</label>
      <div class="stepper">
        <button type="button" id="menos" aria-label="Quitar una persona">−</button>
        <output id="personas-out" aria-live="polite">1</output>
        <button type="button" id="mas" aria-label="Agregar una persona">+</button>
      </div>
    </div>
    <a class="btn btn-wa" id="wa" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.4-.3z"/></svg>
      Confirmar por WhatsApp
    </a>
    <p class="alt">¿No se abre WhatsApp? Envía tu confirmación al <strong>56 1641 0226</strong></p>
  </form>
</main>

<script>
  const PHONE = "525616410226";
  const vid = document.getElementById("vid");
  const soundBtn = document.getElementById("sound");
  const playBtn = document.getElementById("play");

  vid.src = "invitacion.mp4";

  function tryPlay() {
    const p = vid.play();
    if (p && p.catch) p.catch(() => { setTimeout(() => { if (vid.paused) playBtn.hidden = false; }, 300); });
  }
  vid.muted = true;
  vid.addEventListener("playing", () => { playBtn.hidden = true; });
  vid.addEventListener("timeupdate", () => { if (!vid.paused) playBtn.hidden = true; });
  vid.addEventListener("loadeddata", tryPlay);
  setTimeout(() => { if (vid.paused) playBtn.hidden = false; }, 2500);
  tryPlay();

  playBtn.addEventListener("click", () => {
    vid.muted = false;
    soundBtn.textContent = "🔇 Silenciar";
    vid.play().then(() => { playBtn.hidden = true; }).catch(() => {
      vid.muted = true; soundBtn.textContent = "🔊 Activar sonido";
      vid.play().catch(() => {});
    });
  });
  soundBtn.addEventListener("click", () => {
    vid.muted = !vid.muted;
    if (!vid.muted) { vid.currentTime = 0; }
    vid.play().catch(() => {});
    soundBtn.textContent = vid.muted ? "🔊 Activar sonido" : "🔇 Silenciar";
  });

  const nombre = document.getElementById("nombre");
  const out = document.getElementById("personas-out");
  const wa = document.getElementById("wa");
  let personas = 1;

  function updateLink() {
    out.textContent = personas;
    const quien = nombre.value.trim();
    const texto = "¡Hola! Confirmo mi asistencia al Baby Shower de Nathan 💙" +
      (quien ? "\nNombre: " + quien : "") +
      "\nAsistiremos: " + personas + (personas === 1 ? " persona" : " personas");
    wa.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(texto);
  }
  document.getElementById("menos").addEventListener("click", () => { if (personas > 1) { personas--; updateLink(); } });
  document.getElementById("mas").addEventListener("click", () => { if (personas < 20) { personas++; updateLink(); } });
  nombre.addEventListener("input", updateLink);
  document.getElementById("confirmar").addEventListener("submit", e => e.preventDefault());
  document.getElementById("go-rsvp").addEventListener("click", e => {
    e.preventDefault();
    document.getElementById("confirmar").scrollIntoView({ behavior: "smooth", block: "start" });
    setTimeout(() => nombre.focus({ preventScroll: true }), 400);
  });
  updateLink();
</script>
</body>
</html>
